[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secdata"
version = "0.1.0"
description = "Fetch U.S. stock ticker data from SEC EDGAR: filings archive, XBRL facts, 10-K/10-Q, pre-XBRL history, 13F/N-PORT, Form 4, 8-K, DEF 14A, S-1 monitor, enforcement releases."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "The secdata contributors" }]
keywords = ["sec", "edgar", "xbrl", "10-k", "13f", "form-4", "8-k", "def-14a", "s-1", "crawler"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial",
]
dependencies = [
  "requests>=2.28",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
secdata = "secdata.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
